<title>挺拔体态自测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E6%8C%BA%E6%8B%94&display=swap">
<style>
:root{
  --bg:#EDF1EE; --bg2:#E3E9E5; --surface:#FFFFFF; --ink:#0F221D; --ink2:#33463F; --muted:#6A7C75;
  --line:#D8E0DB; --jade:#0F9E7B; --jade-ink:#0A7A5F; --jade-soft:#DCF1E9; --glow:#5FF0C8;
  --amber:#C97A0E; --amber-soft:#FBEBD2; --coral:#D2432F; --coral-soft:#FADFDA;
  --slate:#5D7186; --slate-soft:#E5EBF0; --stage:#0B1613; --on-stage:#E8F3EF;
  --shadow:0 1px 2px rgba(15,34,29,.05),0 10px 30px -12px rgba(15,34,29,.18);
  --font:"Outfit","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --brand:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1311; --bg2:#111D19; --surface:#15211D; --ink:#E6EFEB; --ink2:#C2D0CA; --muted:#8FA39B;
    --line:#233530; --jade:#2BC49B; --jade-ink:#62DDBA; --jade-soft:#143A30;
    --amber:#F0A640; --amber-soft:#3A2A12; --coral:#F26A55; --coral-soft:#3E1C17;
    --slate:#A4B6C9; --slate-soft:#1E2B34; --stage:#040A08;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1311; --bg2:#111D19; --surface:#15211D; --ink:#E6EFEB; --ink2:#C2D0CA; --muted:#8FA39B;
  --line:#233530; --jade:#2BC49B; --jade-ink:#62DDBA; --jade-soft:#143A30;
  --amber:#F0A640; --amber-soft:#3A2A12; --coral:#F26A55; --coral-soft:#3E1C17;
  --slate:#A4B6C9; --slate-soft:#1E2B34; --stage:#040A08;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;min-height:100%;display:flex;flex-direction:column}
:where(button,label.btn){font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--jade);outline-offset:3px;border-radius:12px}

/* ---- top bar ---- */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:6px 14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-mark{font-family:var(--brand);font-size:30px;line-height:1;color:var(--ink);letter-spacing:.02em}
.brand-sub{font-size:13px;color:var(--muted);letter-spacing:.12em}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);
  box-shadow:var(--shadow);color:var(--ink2)}
.icon-btn svg{width:18px;height:18px}

/* ---- home ---- */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px;
  background:var(--surface);border-radius:26px;padding:22px 10px 0 20px;box-shadow:var(--shadow);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 100% 0%,var(--jade-soft),transparent 60%);pointer-events:none}
.hero-text{position:relative;padding-bottom:22px;align-self:center}
.hero h1{font-size:clamp(25px,7.2vw,32px);line-height:1.22;font-weight:700;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--jade-ink)}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.hero-fig{position:relative;width:clamp(104px,30vw,138px);aspect-ratio:3/5}
.hero-fig canvas{width:100%;height:100%;display:block}

.cta{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  height:58px;border-radius:18px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:600;
  letter-spacing:.04em;box-shadow:0 10px 24px -12px rgba(15,34,29,.55);transition:transform .15s ease}
.cta:active{transform:scale(.98)}
.cta svg{width:22px;height:22px}
.privacy{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.privacy svg{width:13px;height:13px}

.section-label{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:26px 0 10px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.howto div{background:var(--surface);border-radius:16px;padding:14px 8px 12px;text-align:center}
.howto svg{width:40px;height:40px;display:block;margin:0 auto 8px;color:var(--jade)}
.howto b{display:block;font-size:13.5px;font-weight:600}
.howto span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}

.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sample{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:var(--bg2);
  box-shadow:var(--shadow);transition:transform .15s ease}
.sample:active{transform:scale(.97)}
.sample img{width:100%;height:100%;object-fit:cover;display:block}
.sample span{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:600;color:#fff;
  background:rgba(8,18,15,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:2px 9px;border-radius:99px}

.foot{margin-top:auto;padding-top:30px;text-align:center;font-size:11.5px;color:var(--muted);opacity:.85}

/* ---- analyze ---- */
.stage{background:var(--stage);border-radius:26px;padding:14px;box-shadow:var(--shadow)}
.frame{position:relative;margin:0 auto;border-radius:16px;overflow:hidden;background:#000;max-width:100%}
.frame img{display:block;width:100%;height:100%;object-fit:contain;transition:filter .5s ease,opacity .5s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frame.dim img{filter:blur(6px) brightness(.45) saturate(.6)}
.frame .grid{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none;
  background-image:linear-gradient(rgba(95,240,200,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(95,240,200,.10) 1px,transparent 1px);
  background-size:22px 22px}
.frame.scanning .grid{opacity:1}
.beam{position:absolute;left:0;right:0;top:0;height:34%;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,rgba(95,240,200,0),rgba(95,240,200,.16) 80%,rgba(160,255,228,.9) 99%,rgba(95,240,200,0));
  transform:translateY(-100%);will-change:transform}
.frame.scanning .beam{opacity:1;animation:sweep 1.5s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(300%)}}

.loader{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:var(--on-stage);text-align:center;padding:20px}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .track{stroke:rgba(255,255,255,.14)}
.ring .bar{stroke:var(--glow);stroke-linecap:round;transition:stroke-dashoffset .25s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.loader .l1{font-size:15px;font-weight:600}
.loader .l2{font-size:12px;opacity:.7;max-width:230px;line-height:1.5}
.loader .err{color:#FFB4A8}
.loader-actions{display:flex;gap:10px;margin-top:6px}
.pill-btn{height:40px;padding:0 18px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--on-stage);font-size:14px;font-weight:600}
.pill-btn.primary{background:var(--glow);color:#07231B}

.steps{list-style:none;margin:18px 4px 0;padding:0;display:grid;gap:12px}
.steps li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);transition:color .3s ease}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;
  transition:all .3s ease}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on i{border-color:var(--jade);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink2)}
.steps li.done i{background:var(--jade);border-color:var(--jade)}
.steps li.done i::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- result ---- */
.photos{display:grid;gap:10px}
.photos.two{grid-template-columns:1fr 1fr}
.pcard{position:relative;background:var(--stage);border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.pcard .frame{border-radius:15px}
.pcard .tag{position:absolute;top:16px;left:16px;z-index:2;font-size:12px;font-weight:600;color:#fff;
  background:rgba(8,18,15,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:2px 10px;border-radius:99px}

.summary{margin:22px 2px 6px;display:flex;gap:14px;align-items:center}
.badge{width:54px;height:54px;border-radius:18px;flex:none;display:grid;place-items:center}
.badge svg{width:28px;height:28px}
.badge.ok{background:var(--jade-soft);color:var(--jade-ink)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.bad{background:var(--coral-soft);color:var(--coral)}
.summary h2{font-size:23px;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
.summary p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

.issue{background:var(--surface);border-radius:22px;padding:18px 18px 16px;margin-top:12px;box-shadow:var(--shadow)}
.issue-head{display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:none;font-variant-numeric:tabular-nums}
.num.notable{background:var(--coral)} .num.slight{background:var(--amber)}
.issue-head h3{font-size:19px;margin:0;font-weight:700;flex:1}
.lv{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.lv.notable{background:var(--coral-soft);color:var(--coral)}
.lv.slight{background:var(--amber-soft);color:var(--amber)}
.lv.borderline{background:var(--slate-soft);color:var(--slate)}
.issue .what{margin:10px 0 0;font-size:15.5px;font-weight:500;color:var(--ink)}
.issue .why{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.tips{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.tips h4{margin:0 0 8px;font-size:13px;color:var(--jade-ink);letter-spacing:.08em;font-weight:600}
.tip{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0}
.tip + .tip{border-top:1px solid var(--line)}
.tip i{grid-row:span 2;width:30px;height:30px;border-radius:10px;background:var(--jade-soft);color:var(--jade-ink);display:grid;place-items:center;margin-top:2px}
.tip i svg{width:16px;height:16px}
.tip b{font-size:15px;font-weight:600}
.tip span{font-size:13.5px;color:var(--ink2);line-height:1.6}

.block{background:var(--surface);border-radius:22px;padding:16px 18px;margin-top:12px;box-shadow:var(--shadow)}
.block h4{margin:0 0 10px;font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:600}
.row{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.row + .row{border-top:1px solid var(--line)}
.row b{font-weight:600;font-size:15px}
.row p{margin:1px 0 0;font-size:13px;color:var(--muted)}
.row .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:99px;
  background:var(--jade-soft);color:var(--jade-ink);font-size:14px;font-weight:600}
.chip svg{width:16px;height:16px}
.note{margin:12px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink2);font-weight:600}

.next{margin-top:12px;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);
  border-radius:22px;padding:16px 18px;text-align:left;width:100%}
.next .grow{flex:1}
.next b{display:block;font-size:16px}
.next span{display:block;font-size:12.5px;opacity:.72;margin-top:2px}
.next svg{width:22px;height:22px;flex:none}
.again{display:block;margin:14px auto 0;height:46px;padding:0 26px;border-radius:99px;background:var(--surface);
  box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--ink2)}

.retake{background:var(--surface);border-radius:22px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.retake .row b{font-size:16px}
.retake .row p{font-size:14px;color:var(--ink2)}
.rx{width:30px;height:30px;border-radius:10px;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;flex:none}
.rx svg{width:16px;height:16px}

.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .frame.scanning .beam{display:none}
}
@media (min-width:560px){ .app{padding-block:28px 36px} }
</style>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark">挺拔</span><span class="brand-sub">体态自测</span></div>
    <button class="icon-btn" id="closeBtn" type="button" aria-label="返回首页" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <!-- home -->
  <section id="home">
    <div class="hero">
      <div class="hero-text">
        <h1>拍一张全身照<br>看看你的<em>体态</em></h1>
        <p>头部前伸、圆肩、高低肩……帮你找出来，再给几个简单的改善动作。</p>
      </div>
      <div class="hero-fig"><canvas id="heroCanvas" aria-hidden="true"></canvas></div>
    </div>

    <label class="cta btn" for="file" id="ctaUpload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
      上传全身照
    </label>
    <input id="file" type="file" accept="image/*" hidden>
    <p class="privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      照片只在你的设备上分析，不会上传
    </p>

    <div class="section-label">这样拍，结果更准</div>
    <div class="howto">
      <div>
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12V6h6M28 6h6v6M34 28v6h-6M12 34H6v-6"/><circle cx="20" cy="11" r="2.6"/><path d="M20 14v9m0 0-3 7m3-7 3 7m-7-13h8"/></svg>
        <b>全身入镜</b><span>头到脚都拍进去</span>
      </div>
      <div>
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="10" r="2.6"/><path d="M12 13v10m-4-8h8m-6 8-2 8m4-8 2 8"/><circle cx="28" cy="10" r="2.6"/><path d="M28 13v10m0 0-.5 8m.5-8 .5 8M28 15l-1 7"/></svg>
        <b>正面或侧面</b><span>正对或完全侧对镜头</span>
      </div>
      <div>
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="20" cy="8" r="2.8"/><path d="M20 11v13m-5-11-1.5 9M25 13l1.5 9M20 24l-2.5 10M20 24l2.5 10"/></svg>
        <b>自然站直</b><span>放松，手臂垂在两侧</span>
      </div>
    </div>

    <div class="section-label">没有合适的照片？试试示例</div>
    <div class="samples" id="samples"></div>
  </section>

  <!-- analyze -->
  <section id="analyze" hidden>
    <div class="stage">
      <div class="frame" id="frame">
        <img id="photo" alt="正在分析的照片">
        <div class="grid"></div>
        <div class="beam"></div>
        <canvas id="overlay"></canvas>
        <div class="loader" id="loader" hidden>
          <div class="ring" id="ring">
            <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="bar" id="ringBar" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
            <b id="ringPct">0%</b>
          </div>
          <div class="l1" id="loaderTitle">正在准备分析模型</div>
          <div class="l2" id="loaderSub">首次使用需要下载约 42 MB，之后再用会快很多</div>
          <div class="loader-actions" id="loaderActions" hidden>
            <button class="pill-btn primary" id="retryBtn" type="button">重试</button>
            <button class="pill-btn" id="toSamplesBtn" type="button">先看示例</button>
          </div>
        </div>
      </div>
    </div>
    <ol class="steps" id="steps">
      <li><i></i><span>识别人体</span></li>
      <li><i></i><span>定位 33 个身体关键点</span></li>
      <li><i></i><span id="stepView">判断拍摄角度</span></li>
      <li><i></i><span>测量体态</span></li>
      <li><i></i><span>生成建议</span></li>
    </ol>
  </section>

  <!-- result -->
  <section id="result" hidden></section>

  <footer class="foot" id="disclaimer"></footer>
</div>

<script>
"use strict";
/* Port of the repo's posture/ package: view, metrics, uncertainty, guards,
   verdicts, and the plain-language report (posture/report.py).

   `C` is generated by scripts/build_web.py from the Python side: noise model,
   thresholds, guard constants and the consumer copy (posture/consumer_zh.json).
   That script also runs this file under node over every test photo and fails
   the build if anything -- view, guards, readings, uncertainties, bands, or
   the report a person reads -- differs from Python. */
const NOSE=0,LEYE=2,REYE=5,LEAR=7,REAR=8,LSH=11,RSH=12,LWR=15,RWR=16,
      LHIP=23,RHIP=24,LKNEE=25,RKNEE=26,LANK=27,RANK=28;
const NAMES=["nose","left_eye_inner","left_eye","left_eye_outer","right_eye_inner","right_eye",
"right_eye_outer","left_ear","right_ear","mouth_left","mouth_right","left_shoulder","right_shoulder",
"left_elbow","right_elbow","left_wrist","right_wrist","left_pinky","right_pinky","left_index",
"right_index","left_thumb","right_thumb","left_hip","right_hip","left_knee","right_knee",
"left_ankle","right_ankle","left_heel","right_heel","left_foot_index","right_foot_index"];
const EDGES=[[7,2],[2,0],[0,5],[5,8],[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],
[23,24],[23,25],[25,27],[27,31],[24,26],[26,28],[28,32]];
const CRIT=[LEAR,REAR,LSH,RSH,LHIP,RHIP,LANK,RANK];
const DIAG=new Set(C.diagnostic_only);

const D=Math.PI/180, deg=r=>r/D;
const px=(P,i)=>({x:P[i][0],y:P[i][1]}), vis=(P,i)=>P[i][2];
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const angV=(lo,up,ant)=>deg(Math.atan2((up.x-lo.x)*ant,-(up.y-lo.y)));
function angH(l,r){let dx=r.x-l.x,dy=-(r.y-l.y);if(!dx&&!dy)return 0;
  let a=deg(Math.atan2(dy,dx));if(a>90)a-=180;else if(a<=-90)a+=180;return a;}
function angI(a,v,c){const v1={x:a.x-v.x,y:a.y-v.y},v2={x:c.x-v.x,y:c.y-v.y};
  const n1=Math.hypot(v1.x,v1.y),n2=Math.hypot(v2.x,v2.y);if(!n1||!n2)return NaN;
  return deg(Math.acos(Math.max(-1,Math.min(1,(v1.x*v2.x+v1.y*v2.y)/(n1*n2)))));}

function bodyScale(P,W,H){
  const sh=mid(px(P,LSH),px(P,RSH)), hip=mid(px(P,LHIP),px(P,RHIP));
  const inF=i=>{const p=px(P,i);return p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H;};
  if(inF(LANK)&&inF(RANK)){const d=dist(sh,mid(px(P,LANK),px(P,RANK)));if(d>1)return d;}
  return dist(sh,hip)*2.6;  // shoulder-to-ankle is ~2.6x shoulder-to-hip
}
function sig(name,scale){const f=C.noise.per_landmark[name];return (f==null?C.noise.overall:f)*scale;}
const angSig=(sa,sb,span)=>span<=1e-6?NaN:deg(Math.hypot(sa,sb)/span);

function estimateView(P,W,H){
  const scale=Math.max(1,bodyScale(P,W,H));
  const lsh=px(P,LSH),rsh=px(P,RSH),lh=px(P,LHIP),rh=px(P,RHIP);
  const spread=Math.abs(lsh.x-rsh.x)/scale;
  const view=spread<=C.view.SIDE_MAX_SPREAD?"side":(spread>=C.view.FRONT_MIN_SPREAD?"front":"oblique");
  const nose=px(P,NOSE),em=mid(px(P,LEAR),px(P,REAR));
  const href=Math.max(dist(px(P,LEAR),px(P,REAR)),scale*0.06);
  const dx=nose.x-em.x;
  return {view,spread,facing:dx>=0?1:-1,conf:href>0?Math.min(1,Math.abs(dx)/href):0,
          hipSpread:Math.abs(lh.x-rh.x)/scale,scale};
}
function nearSide(P){
  const lv=vis(P,LEAR),rv=vis(P,REAR);let left;
  if(Math.abs(lv-rv)>0.15) left=lv>rv;
  else {const nx=px(P,NOSE).x;
        left=Math.abs(px(P,LEAR).x-nx)>Math.abs(px(P,REAR).x-nx);}
  return left?{ear:LEAR,sh:LSH,hip:LHIP,knee:LKNEE,ank:LANK}
             :{ear:REAR,sh:RSH,hip:RHIP,knee:RKNEE,ank:RANK};
}
const M=(key,val,unc,plane,span,idx)=>({key,val,unc,plane,span,idx});

function computeSagittal(P,V){
  const s=V.scale,S=nearSide(P),ant=V.facing,o={};
  const g=i=>sig(NAMES[i],s);
  const ear=px(P,S.ear),sh=px(P,S.sh),hip=px(P,S.hip),kn=px(P,S.knee),an=px(P,S.ank);
  let sp=dist(sh,ear);
  o.forward_head=M("forward_head",angV(sh,ear,ant),angSig(g(S.sh),g(S.ear),sp),"sagittal",sp,[S.sh,S.ear]);
  sp=dist(hip,sh);
  o.shoulder_protraction=M("shoulder_protraction",angV(hip,sh,ant),angSig(g(S.hip),g(S.sh),sp),"sagittal",sp,[S.hip,S.sh]);
  sp=dist(an,hip);
  o.trunk_sway=M("trunk_sway",angV(an,hip,ant),angSig(g(S.ank),g(S.hip),sp),"sagittal",sp,[S.ank,S.hip]);
  sp=dist(hip,ear);
  o.head_over_hip=M("head_over_hip",angV(hip,ear,ant),angSig(g(S.hip),g(S.ear),sp),"sagittal",sp,[S.hip,S.ear]);
  const inter=angI(hip,kn,an), legLen=dist(hip,an);
  if(legLen>1e-6&&!isNaN(inter)){
    const cross=(an.x-hip.x)*(kn.y-hip.y)-(an.y-hip.y)*(kn.x-hip.x);
    const sgn=(cross*ant)<0?1:-1, sp2=legLen/2;
    o.knee_deviation=M("knee_deviation",(180-inter)*sgn,angSig(g(S.knee),g(S.knee),sp2),"sagittal",sp2,[S.hip,S.knee,S.ank]);
  }
  o._near=S;
  return o;
}
function computeFrontal(P,V){
  const s=V.scale,o={},g=i=>sig(NAMES[i],s);
  const lsh=px(P,LSH),rsh=px(P,RSH),lh=px(P,LHIP),rh=px(P,RHIP),le=px(P,LEYE),re=px(P,REYE);
  let sp=dist(rsh,lsh);
  o.shoulder_tilt=M("shoulder_tilt",angH(rsh,lsh),angSig(g(RSH),g(LSH),sp),"frontal",sp,[RSH,LSH]);
  sp=dist(rh,lh);
  o.pelvis_tilt=M("pelvis_tilt",angH(rh,lh),angSig(g(RHIP),g(LHIP),sp),"frontal",sp,[RHIP,LHIP]);
  sp=dist(re,le);
  o.head_tilt=M("head_tilt",angH(re,le),angSig(g(REYE),g(LEYE),sp),"frontal",sp,[REYE,LEYE]);
  const shm=mid(lsh,rsh),hipm=mid(lh,rh);sp=dist(hipm,shm);
  if(sp>1e-6){const n=px(P,NOSE);
    o.lateral_head_shift=M("lateral_head_shift",deg(Math.atan2(n.x-shm.x,sp)),angSig(g(NOSE),g(LSH),sp),
      "frontal",sp,[NOSE,LSH,RSH]);}
  if(o.shoulder_tilt&&o.head_tilt){
    o.head_vs_shoulder_tilt=M("head_vs_shoulder_tilt",o.head_tilt.val-o.shoulder_tilt.val,
      Math.hypot(o.head_tilt.unc,o.shoulder_tilt.unc),"frontal",Math.min(o.head_tilt.span,o.shoulder_tilt.span),
      o.head_tilt.idx.concat(o.shoulder_tilt.idx));}
  return o;
}
function computeAll(P,V){
  let o={},near=null;
  if(V.view==="side"||V.view==="oblique"){const s=computeSagittal(P,V);near=s._near;delete s._near;Object.assign(o,s);}
  if(V.view==="front"||V.view==="oblique")Object.assign(o,computeFrontal(P,V));
  return {mets:o,near};
}
function outOfFrame(P,W,H){
  const m=C.guards.OUT_OF_FRAME_MARGIN*bodyScale(P,W,H),s=new Set();
  for(let i=0;i<33;i++){const p=px(P,i);
    if(p.x<-m||p.x>W+m||p.y<-m||p.y>H+m)s.add(i);}
  return s;
}
/* Stability (guards.check_landmark_stability). P2 is the same photo detected
   again after a 4% downscale-and-restore; null means nothing was found the
   second time, undefined means the check was not run. */
function stability(P,P2,W,H){
  if(P2===undefined)return {findings:[],drifted:new Set()};
  if(P2===null)return {findings:[{sev:"block",key:"unstable_detection"}],drifted:new Set()};
  const sc=bodyScale(P,W,H),drifted=new Set();
  if(sc<=1e-6)return {findings:[],drifted};
  for(const i of CRIT)if(dist(px(P,i),px(P2,i))/sc>C.guards.UNSTABLE_LANDMARK_FRAC)drifted.add(i);
  return {findings:drifted.size?[{sev:"warn",key:"unstable_landmarks"}]:[],drifted};
}
function guards(P,V,mets,W,H,S,others,origS){
  const out=[],oof=outOfFrame(P,W,H),g=C.guards;
  if([...oof].some(i=>CRIT.includes(i)))out.push({sev:"warn",key:"landmarks_out_of_frame"});
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);
  const dg=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  for(const o of (others||[])){const d=Math.hypot(o[2]-o[0],o[3]-o[1]);
    if(dg>0&&d/dg>=g.BYSTANDER_SIZE_RATIO){out.push({sev:"block",key:"multiple_people"});break;}}
  const shm=mid(px(P,LSH),px(P,RSH)),hipm=mid(px(P,LHIP),px(P,RHIP)),ankm=mid(px(P,LANK),px(P,RANK));
  const torso=dist(shm,hipm),leg=dist(hipm,ankm);
  if(leg<=1e-6)out.push({sev:"block",key:"degenerate_geometry"});
  else{const r=torso/leg;
    if(r<g.TORSO_LEG_RATIO_MIN||r>g.TORSO_LEG_RATIO_MAX)out.push({sev:"block",key:"implausible_proportions"});}
  if(V.view==="oblique")out.push({sev:"block",key:"oblique_view"});
  if(V.view==="side"&&V.conf<0.25)out.push({sev:"warn",key:"facing_ambiguous"});
  // Deliberately NOT skipped when the ankle is out of frame, exactly as in
  // guards.check_pose_neutrality: a half-body photo's extrapolated legs are
  // what gets it rejected. An earlier port skipped these and let such photos
  // through; checking every test photo instead of six samples caught it.
  const kn=mets.knee_deviation,ts=mets.trunk_sway;
  if(kn&&kn.val>g.MAX_KNEE_FLEXION)out.push({sev:"block",key:"knee_flexed"});
  if(ts&&Math.abs(ts.val)>g.MAX_TRUNK_LEAN)out.push({sev:"block",key:"trunk_leaning"});
  if(V.view==="front"||V.view==="oblique"){
    if(!oof.has(LANK)&&!oof.has(RANK)){
      const hw=dist(px(P,LHIP),px(P,RHIP)),aw=dist(px(P,LANK),px(P,RANK));
      if(hw>1e-6&&aw/hw>g.MAX_STANCE_WIDTH_RATIO)out.push({sev:"block",key:"stance_too_wide"});
      const knees=[angI(px(P,LHIP),px(P,LKNEE),px(P,LANK)),angI(px(P,RHIP),px(P,RKNEE),px(P,RANK))].filter(a=>!isNaN(a));
      if(knees.length&&Math.max(...knees)<g.MIN_KNEE_EXTENSION_FRONT_DEG)out.push({sev:"block",key:"knees_not_extended"});
      if(Math.abs(hipm.x-ankm.x)/S>g.MAX_WEIGHT_SHIFT_FRAC)out.push({sev:"warn",key:"weight_on_one_leg"});
    }
    if((px(P,LWR).y-px(P,LHIP).y)/S<g.MIN_WRIST_BELOW_HIP_FRAC||(px(P,RWR).y-px(P,RHIP).y)/S<g.MIN_WRIST_BELOW_HIP_FRAC)
      out.push({sev:"warn",key:"arms_not_at_side"});
  }
  for(const k in mets){const m=mets[k];
    if(m.plane==="sagittal"&&Math.abs(m.val)>g.MAX_PLAUSIBLE_ANGLE){out.push({sev:"block",key:"implausible_reading"});break;}}
  // Absolute pixels, so judged on the photo's original resolution.
  if(V.view!=="front"&&(origS||S)<g.MIN_SUBJECT_HEIGHT_PX)out.push({sev:"warn",key:"subject_too_small"});
  return {findings:out,oof};
}
function classify(sp,v){const x=sp.direction==="positive_only"?v:Math.abs(v);
  return x>=sp.notable?"notable":(x>=sp.slight?"slight":"reference");}

/* S: {lm, w, h, others, oscale, lm2}. Mirrors assess.assess(). */
function assess(S){
  const P=S.lm,W=S.w,H=S.h,V=estimateView(P,W,H);
  const {mets,near}=computeAll(P,V);
  const {findings,oof}=guards(P,V,mets,W,H,V.scale,S.others,S.oscale);
  const st=stability(P,S.lm2,W,H);findings.push(...st.findings);
  const unavail={},unstable={};
  for(const k in mets){const idx=mets[k].idx;
    const bad=idx.filter(i=>oof.has(i));if(bad.length){unavail[k]=bad;continue;}
    const dr=idx.filter(i=>st.drifted.has(i));if(dr.length)unstable[k]=dr;}
  let blocked=findings.some(f=>f.sev==="block");
  const judged=Object.keys(mets).filter(k=>!DIAG.has(k)&&C.thresholds[k]);
  if(judged.length&&judged.every(k=>unavail[k]||unstable[k])){blocked=true;
    findings.push({sev:"block",key:"all_metrics_unavailable"});}
  const verdicts={};
  if(!blocked)for(const k in mets){
    if(DIAG.has(k)||unavail[k]||unstable[k])continue;
    const sp=C.thresholds[k];if(!sp)continue;
    const m=mets[k],band=classify(sp,m.val);
    const floored=!isNaN(m.unc)&&(sp.notable-sp.slight)>0&&m.unc>=(sp.notable-sp.slight);
    const lo=classify(sp,m.val-m.unc),hi=classify(sp,m.val+m.unc);
    const resolved=!isNaN(m.unc)&&lo===band&&hi===band&&!floored;
    verdicts[k]={band,resolved,floored,sp,m};
  }
  return {V,mets,near,findings,unavail,unstable,blocked,verdicts,P,W,H};
}

/* ---- the plain answer: port of posture/report.py ---- */
const ISSUE_ORDER=["head_over_hip","shoulder_protraction","trunk_sway","shoulder_tilt","lateral_head_shift"];
function levelFor(v){
  if(v.floored)return "not_measured";
  const m=v.m,sp=v.sp,u=isNaN(m.unc)?0:m.unc;
  const nearest=sp.direction==="positive_only"?m.val-u:(Math.abs(m.val)<=u?0:Math.abs(m.val)-u);
  const lowest=classify(sp,nearest);
  if(lowest==="notable")return "notable";
  if(lowest==="slight")return "slight";
  return v.resolved?"good":"borderline";
}
function imageSide(P,a,b){  // image-left/right of the HIGHER of two landmarks
  const pa=px(P,a),pb=px(P,b),top=pa.y<pb.y?pa:pb,other=top===pa?pb:pa;
  return top.x<other.x?"left":"right";
}
function direction(key,r){
  const m=r.mets[key];
  if(key==="trunk_sway")return {direction:m.val>0?"forward":"back"};
  if(key==="shoulder_tilt")return {side:imageSide(r.P,LSH,RSH)};
  if(key==="pelvis_tilt")return {side:imageSide(r.P,LHIP,RHIP)};
  if(key==="lateral_head_shift")return {side:m.val>0?"right":"left"};
  return {};
}
function copyFor(key,extra){
  let c=C.copy.issues[key];
  if(key==="trunk_sway")c=Object.assign({},c,c[extra.direction||"forward"]);
  const side=C.copy.sides[extra.side]||"";
  return {name:c.name,summary:c.summary.replace("{side}",side),why:c.why,tips:c.tips};
}
function partsOf(idx){
  const out=[];
  for(const i of idx)for(const [frag,part] of Object.entries(C.copy.parts))
    if(NAMES[i].includes(frag)&&!out.includes(part))out.push(part);
  return out.join("、")||"部分身体";
}
function report(r){
  const K=C.copy,view=r.V.view,other={side:"front",front:"side"}[view];
  const base={view,disclaimer:K.disclaimer,
    other_view:other?Object.assign({view:other},K.other_view[other]):null};
  const empty={issues:[],borderline:[],good:[],not_measured:[],photo_tips:[]};
  if(r.blocked){
    const seen=new Set(),retake=[];
    for(const f of r.findings){if(f.sev!=="block"||seen.has(f.key))continue;seen.add(f.key);
      const c=K.retake[f.key];if(c)retake.push(Object.assign({key:f.key},c));}
    if(!retake.length)retake.push({key:"unknown",title:"这张照片没法分析",tip:"请换一张从头到脚、站直拍的全身照。"});
    return Object.assign(base,empty,{status:"retake",retake});
  }
  const issues=[],borderline=[],good=[],nm=[];
  for(const key of ISSUE_ORDER){
    if(!K.issues[key])continue;
    const goodName=K.issues[key].good;
    if(r.unavail[key]){nm.push({key,name:goodName,reason:K.not_measured.out_of_frame.replace("{parts}",partsOf(r.unavail[key]))});continue;}
    if(r.unstable[key]){nm.push({key,name:goodName,reason:K.not_measured.unstable});continue;}
    const v=r.verdicts[key];if(!v)continue;
    const lvl=levelFor(v);
    if(lvl==="not_measured"){nm.push({key,name:goodName,reason:K.not_measured.floored});continue;}
    if(lvl==="good"){good.push({key,name:goodName});continue;}
    const extra=direction(key,r);
    const item=Object.assign({key,level:lvl,level_label:K.levels[lvl],landmarks:r.mets[key].idx.slice()},extra,copyFor(key,extra));
    (lvl==="borderline"?borderline:issues).push(item);
  }
  if(!(issues.length||borderline.length||good.length))
    return Object.assign(base,empty,{status:"retake",not_measured:nm,
      retake:[Object.assign({key:"nothing_judged"},K.retake.unstable_detection)]});
  issues.sort((a,b)=>(a.level==="notable"?0:1)-(b.level==="notable"?0:1));
  const tips=r.findings.filter(f=>f.sev==="warn"&&K.photo_tips[f.key]).map(f=>K.photo_tips[f.key]);
  return Object.assign(base,{status:"ok",retake:[],issues,borderline,good,not_measured:nm,photo_tips:tips});
}
if(typeof module!=="undefined")module.exports={assess,report,estimateView,EDGES,NAMES};

</script>
<script>
"use strict";
/* Loads MediaPipe PoseLandmarker in the browser, from files published next to
   the page.

   Why the unusual loading: the page may run under a CSP that allows scripts
   from a CDN but blocks fetch() to anything except its own origin. So the
   loader script comes from the CDN (a <script> tag), while the .wasm binary
   and the model are fetched from our own origin and handed over as bytes --
   which also gives us a real download-progress number for the loading screen.

   Settings mirror posture/landmarks.py exactly (IMAGE mode, up to 4 poses,
   0.5 detection/presence confidence, CPU). The multi-person guard needs
   numPoses > 1, and CPU keeps results identical to the Python reference. */
const Engine = (() => {
  const VISION_VERSION = "1.0.1";   // must match the Python mediapipe version
  const CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@" + VISION_VERSION;
  let landmarker = null, loading = null;

  async function fetchBytes(url, onBytes) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("下载失败 " + url + " (" + r.status + ")");
    if (!r.body || !r.body.getReader) {
      const b = new Uint8Array(await r.arrayBuffer()); onBytes(b.length); return b;
    }
    const rd = r.body.getReader(), parts = []; let n = 0;
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      parts.push(value); n += value.length; onBytes(value.length);
    }
    const out = new Uint8Array(n); let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }

  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.crossOrigin = "anonymous";
      s.onload = res; s.onerror = () => rej(new Error("脚本加载失败 " + src));
      document.head.appendChild(s);
    });
  }

  // Some hosts serve only web file types, so the model may arrive as base64
  // text parts instead of raw bytes.
  function fromBase64(bytes) {
    const s = atob(new TextDecoder().decode(bytes).replace(/\s+/g, ""));
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  /* opts: {base, loaderUrl, wasm, modelParts: [...paths], modelEncoding: "binary"|"base64",
            totalBytes, onProgress(frac)} */
  function load(opts) {
    if (loading) return loading;
    loading = (async () => {
      const base = opts.base || document.baseURI;
      let got = 0;
      const tick = n => { got += n; opts.onProgress && opts.onProgress(Math.min(0.99, got / opts.totalBytes)); };
      if (typeof Vision === "undefined") await loadScript(opts.bundleUrl || CDN + "/vision_bundle.js");
      let [wasm, ...parts] = await Promise.all(
        [opts.wasm, ...opts.modelParts].map(p => fetchBytes(new URL(p, base).href, tick)));
      if (opts.modelEncoding === "base64") parts = parts.map(fromBase64);
      let model;
      if (parts.length === 1) model = parts[0];
      else {
        model = new Uint8Array(parts.reduce((s, p) => s + p.length, 0));
        let o = 0; for (const p of parts) { model.set(p, o); o += p.length; }
      }
      // The emscripten loader picks up a pre-set Module and uses wasmBinary
      // instead of fetching the binary itself.
      self.Module = { wasmBinary: wasm.buffer };
      landmarker = await Vision.PoseLandmarker.createFromOptions(
        { wasmLoaderPath: opts.loaderUrl || CDN + "/wasm/vision_wasm_internal.js",
          wasmBinaryPath: new URL(opts.wasm, base).href },
        { baseOptions: { modelAssetBuffer: model, delegate: "CPU" },
          runningMode: "IMAGE", numPoses: 4,
          minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5,
          outputSegmentationMasks: false });
      opts.onProgress && opts.onProgress(1);
      return landmarker;
    })();
    loading.catch(() => { loading = null; });
    return loading;
  }

  /* Returns {lm: [[x,y,vis]...33], others: [[x0,y0,x1,y1]...], n} in pixels of
     the source, or null when no person is found. First pose is the subject,
     exactly as in landmarks.detect(). */
  function detect(source, W, H) {
    const r = landmarker.detect(source);
    if (!r.landmarks || !r.landmarks.length) return null;
    const toPx = pose => pose.map(p => [p.x * W, p.y * H, p.visibility == null ? 0 : p.visibility]);
    const lm = toPx(r.landmarks[0]);
    const others = r.landmarks.slice(1).map(pose => {
      const xs = pose.map(p => p.x * W), ys = pose.map(p => p.y * H);
      return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
    });
    return { lm, others, n: r.landmarks.length };
  }

  return { load, detect, get ready() { return !!landmarker; } };
})();

<script>
"use strict";
/* UI for the posture check: upload -> (model download) -> scan animation ->
   plain result. All judging is done by posture.js; this file only shows it. */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const MAX_SIDE=2048;                 // cap on the analysed canvas; the model sees 256px crops anyway
const MB=Math.round(C.assets.bytes/1e6);
const LEVEL_RGB={notable:"#FF6A55",slight:"#FFB23F",borderline:"#B9C8D8"};
const VIEW_ZH={side:"侧面",front:"正面"};
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6.5v7M12 17.5v.01"/></svg>',
  move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v4M6 11l3-3 4 1 3 3 3 1M11 15l1-5"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>'
};

const state={results:{},last:null,busy:false};
const fileInput=$("#file");

/* ---------------- analysis engine (downloaded in the background) -------- */
let engineErr=null;const progressFns=new Set();
function startEngine(){
  return Engine.load({wasm:C.assets.wasm,modelParts:C.assets.model,modelEncoding:C.assets.encoding,totalBytes:C.assets.bytes,
    onProgress:f=>progressFns.forEach(fn=>fn(f))})
    .then(x=>{engineErr=null;return x;},e=>{engineErr=e;throw e;});
}
// Most people pick a photo within seconds of arriving; starting the download
// now means the wait is mostly over by then. Skipped when the browser asks to
// save data -- then it starts on the first upload instead.
if(!(navigator.connection&&navigator.connection.saveData))
  setTimeout(()=>startEngine().catch(()=>{}),900);

/* ---------------- screens ---------------- */
function show(name){
  for(const id of ["home","analyze","result"])$("#"+id).hidden=id!==name;
  $("#closeBtn").hidden=name==="home";
  window.scrollTo({top:0});
  hero.run(name==="home");
}
$("#closeBtn").addEventListener("click",()=>{if(!state.busy)show("home");});
$("#disclaimer").textContent=C.copy.disclaimer;

/* ---------------- photo handling ---------------- */
async function fromFile(file){
  const url=URL.createObjectURL(file);
  const img=new Image();img.src=url;
  await img.decode();   // <img> applies the EXIF orientation of phone photos
  const W0=img.naturalWidth,H0=img.naturalHeight,f=Math.min(1,MAX_SIDE/Math.max(W0,H0));
  const W=Math.round(W0*f),H=Math.round(H0*f);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  cv.getContext("2d").drawImage(img,0,0,W,H);
  return {src:url,W,H,f,canvas:cv};
}
// Same perturbation as guards.check_landmark_stability: 4% down and back up.
function perturbed(cv){
  const w=Math.max(1,Math.floor(cv.width*0.96)),h=Math.max(1,Math.floor(cv.height*0.96));
  const a=document.createElement("canvas");a.width=w;a.height=h;
  const ax=a.getContext("2d");ax.imageSmoothingQuality="high";ax.drawImage(cv,0,0,w,h);
  const b=document.createElement("canvas");b.width=cv.width;b.height=cv.height;
  const bx=b.getContext("2d");bx.imageSmoothingQuality="high";bx.drawImage(a,0,0,cv.width,cv.height);
  return b;
}

/* ---------------- analyze screen ---------------- */
const frame=$("#frame"),photo=$("#photo"),overlay=$("#overlay"),loader=$("#loader");
function fitFrame(fr,W,H,maxW,maxH){
  const k=Math.min(maxW/W,maxH/H);
  fr.style.width=Math.round(W*k)+"px";fr.style.height=Math.round(H*k)+"px";
}
function sizeStage(ph){
  const maxW=frame.parentElement.clientWidth-28;
  fitFrame(frame,ph.W,ph.H,maxW,Math.max(260,window.innerHeight*0.58));
}
function steps(i,viewText){
  const li=[...document.querySelectorAll("#steps li")];
  li.forEach((el,j)=>{el.classList.toggle("done",j<i);el.classList.toggle("on",j===i);});
  if(viewText)$("#stepView").textContent="判断拍摄角度："+viewText;
  else if(i<=2)$("#stepView").textContent="判断拍摄角度";
}
async function ensureEngine(){
  if(Engine.ready)return true;
  frame.classList.add("dim");loader.hidden=false;$("#loaderActions").hidden=true;
  $("#ring").hidden=false;
  $("#loaderTitle").textContent="正在准备分析模型";$("#loaderTitle").classList.remove("err");
  const setP=f=>{const p=Math.round(f*100);$("#ringPct").textContent=p+"%";
    $("#ringBar").style.strokeDashoffset=String(276.5*(1-f));
    $("#loaderSub").textContent="首次使用需要下载约 "+MB+" MB（已完成 "+Math.round(f*MB)+" MB），之后会快很多";};
  setP(0);progressFns.add(setP);
  try{await startEngine();return true;}
  catch(e){
    $("#ring").hidden=true;
    $("#loaderTitle").textContent="分析模型没能加载";$("#loaderTitle").classList.add("err");
    $("#loaderSub").textContent="可能是网络不稳定。可以重试，或先看看示例的分析效果。";
    $("#loaderActions").hidden=false;
    console.error(e);return false;
  }finally{progressFns.delete(setP);}
}
$("#retryBtn").addEventListener("click",()=>{if(state.pending)analyze(state.pending);});
$("#toSamplesBtn").addEventListener("click",()=>{state.busy=false;show("home");
  $("#samples").scrollIntoView({behavior:REDUCED?"auto":"smooth",block:"center"});});

/* job: {kind:"file", file} | {kind:"sample", sample} */
async function analyze(job){
  state.pending=job;state.busy=true;
  show("analyze");steps(0);
  const ctx=overlay.getContext("2d");ctx.clearRect(0,0,overlay.width,overlay.height);
  frame.classList.remove("scanning","dim");loader.hidden=true;
  let ph,S=null;
  if(job.kind==="file"){
    try{ph=await fromFile(job.file);}
    catch(e){state.busy=false;return finish({ph:null,S:null,r:null,rep:retakeOnly("unreadable")});}
  }else{
    const s=job.sample;ph={src:"data:image/jpeg;base64,"+s.jpg,W:s.w,H:s.h,f:1};
  }
  photo.src=ph.src;sizeStage(ph);sizeCanvas(overlay,frame);
  if(job.kind==="file"&&!(await ensureEngine())){state.busy=false;return;}
  frame.classList.remove("dim");loader.hidden=true;
  frame.classList.add("scanning");
  await nextFrame();await sleep(REDUCED?0:450);
  const t0=performance.now();
  if(job.kind==="file"){
    const det=Engine.detect(ph.canvas,ph.W,ph.H);
    if(det){
      const det2=Engine.detect(perturbed(ph.canvas),ph.W,ph.H);
      S={lm:det.lm,others:det.others,w:ph.W,h:ph.H,lm2:det2?det2.lm:null};
      S.oscale=estimateView(S.lm,S.w,S.h).scale/ph.f;
    }
  }else{
    const s=job.sample;S={lm:s.lm,lm2:s.lm2,others:s.others,w:s.w,h:s.h,oscale:s.oscale};
  }
  // Let the sweep read as a scan even when detection is instant.
  const left=(REDUCED?0:1100)-(performance.now()-t0);if(left>0)await sleep(left);
  frame.classList.remove("scanning");
  const r=S?assess(S):null;
  const rep=r?report(r):retakeOnly("no_pose");
  const entry={ph,S,r,rep};
  if(r)await scanReveal(entry);
  state.busy=false;
  finish(entry);
}
function retakeOnly(key){
  const c=key==="unreadable"?{title:"读不出这张图片",tip:"请换一张 JPG 或 PNG 格式的照片。"}:C.copy.retake.no_pose;
  return {status:"retake",retake:[Object.assign({key},c)],issues:[],borderline:[],good:[],not_measured:[],photo_tips:[],other_view:null};
}
async function scanReveal(entry){
  const {r,rep}=entry,marks=marksFor(entry,rep.issues.map((x,i)=>Object.assign({num:i+1},x)).concat(rep.borderline));
  const T={pts:0,edges:0,plumb:0,marks:0};
  const run=(key,ms)=>new Promise(res=>{
    if(REDUCED){T[key]=1;drawOverlay(overlay,entry,T,marks);return res();}
    const t0=performance.now();
    const tick=now=>{T[key]=Math.min(1,(now-t0)/ms);drawOverlay(overlay,entry,T,marks,now);
      T[key]<1?requestAnimationFrame(tick):res();};
    requestAnimationFrame(tick);
  });
  steps(1);await run("pts",750);
  steps(2,VIEW_ZH[r.V.view]||"斜侧");await run("edges",520);
  steps(3);await run("plumb",480);await run("marks",520);
  steps(4);await sleep(REDUCED?0:420);steps(5);await sleep(REDUCED?0:260);
}
function finish(entry){
  state.last=entry;
  if(entry.rep.status==="ok")state.results[entry.rep.view]=entry;
  entry.rep.status==="ok"?renderResult():renderRetake(entry);
  show("result");
  requestAnimationFrame(()=>drawResultPhotos());
}

/* ---------------- overlay drawing ---------------- */
function sizeCanvas(cv,box){
  const dpr=Math.min(2.5,window.devicePixelRatio||1),w=box.clientWidth,h=box.clientHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv._dpr=dpr;
}
const ease=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const JOINTS=[0,7,8,11,12,13,14,15,16,23,24,25,26,27,28,31,32];

/* Which landmark each finding points at, per view. */
function marksFor(entry,items){
  const {r}=entry,P=r.P,near=r.near;const out=[];
  for(const it of items){
    let a=null;
    if(it.key==="head_over_hip"&&near)a=near.ear;
    else if(it.key==="shoulder_protraction"&&near)a=near.sh;
    else if(it.key==="trunk_sway"&&near)a=near.ank;
    else if(it.key==="shoulder_tilt")a=P[11][1]<P[12][1]?11:12;
    else if(it.key==="lateral_head_shift")a=0;
    if(a!=null)out.push({a,num:it.num||0,level:it.level,key:it.key});
  }
  return out;
}
/* The vertical reference drawn on the photo is the one the readings are taken
   against: through the hip in a side view (head and shoulder are measured
   relative to it), through the shoulder midpoint in a front view (head shift
   is). The ankle's offset from the hip line is the trunk reading. */
function plumbX(r){
  const P=r.P;
  if(r.V.view==="side"&&r.near)return P[r.near.hip][0];
  return (P[11][0]+P[12][0])/2;
}
function drawOverlay(cv,entry,T,marks,now){
  const {r}=entry,P=r.P,ctx=cv.getContext("2d"),dpr=cv._dpr||1;
  const k=cv.width/dpr/r.W;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const X=i=>P[i][0]*k,Y=i=>P[i][1]*k;
  const lw=Math.max(1.6,Math.min(3.2,cv.width/dpr/150));
  // plumb / midline
  if(T.plumb>0){
    const x=plumbX(r)*k,top=Math.min(Y(0),Y(7),Y(8))-r.V.scale*k*0.08;
    const bottom=Math.min(cv.height/dpr,Math.max(Y(27),Y(28))+6);
    const y1=top+(bottom-top)*ease(T.plumb);
    ctx.save();ctx.setLineDash([6,6]);ctx.lineWidth=lw;
    ctx.strokeStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.moveTo(x+1,top+1);ctx.lineTo(x+1,y1+1);ctx.stroke();
    ctx.strokeStyle="#5FF0C8";ctx.shadowColor="rgba(95,240,200,.8)";ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,y1);ctx.stroke();ctx.restore();
    ctx.fillStyle="#5FF0C8";ctx.beginPath();ctx.arc(x,top,lw*1.6,0,7);ctx.fill();
  }
  // skeleton
  if(T.edges>0){
    ctx.save();ctx.lineCap="round";
    for(const pass of [0,1]){
      ctx.lineWidth=pass?lw:lw+2.4;ctx.strokeStyle=pass?"rgba(255,255,255,.92)":"rgba(0,0,0,.35)";
      for(const [a,b] of EDGES){const e=ease(T.edges);
        ctx.beginPath();ctx.moveTo(X(a),Y(a));ctx.lineTo(X(a)+(X(b)-X(a))*e,Y(a)+(Y(b)-Y(a))*e);ctx.stroke();}
    }
    ctx.restore();
  }
  if(T.pts>0){
    const ys=JOINTS.map(Y),y0=Math.min(...ys),y1=Math.max(...ys);
    for(const i of JOINTS){
      const d=(Y(i)-y0)/Math.max(1,y1-y0),t=Math.max(0,Math.min(1,(T.pts*1.35-d*0.35)/1));
      if(t<=0)continue;const rr=Math.max(0,back(t))*lw*1.55;
      ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.arc(X(i),Y(i),rr+1.4,0,7);ctx.fill();
      ctx.fillStyle="#5FF0C8";ctx.beginPath();ctx.arc(X(i),Y(i),rr,0,7);ctx.fill();
    }
  }
  // findings
  if(T.marks>0&&marks.length){
    const px0=plumbX(r)*k;
    for(const m of marks){
      const col=LEVEL_RGB[m.level]||"#fff",x=X(m.a),y=Y(m.a),e=ease(T.marks);
      if(m.key==="shoulder_tilt"){
        ctx.save();ctx.lineWidth=lw+.6;ctx.strokeStyle=col;ctx.lineCap="round";
        ctx.beginPath();ctx.moveTo(X(11),Y(11));ctx.lineTo(X(11)+(X(12)-X(11))*e,Y(11)+(Y(12)-Y(11))*e);ctx.stroke();
        ctx.setLineDash([4,5]);ctx.lineWidth=lw*.8;ctx.strokeStyle="rgba(255,255,255,.75)";
        const yl=Math.min(Y(11),Y(12)),xa=Math.min(X(11),X(12))-12,xb=Math.max(X(11),X(12))+12;
        ctx.beginPath();ctx.moveTo(xa,yl);ctx.lineTo(xa+(xb-xa)*e,yl);ctx.stroke();ctx.restore();
      }else{
        ctx.save();ctx.lineWidth=lw+.8;ctx.strokeStyle=col;ctx.lineCap="round";
        ctx.beginPath();ctx.moveTo(px0,y);ctx.lineTo(px0+(x-px0)*e,y);ctx.stroke();ctx.restore();
      }
      const pulse=now&&T.marks<1?1+0.25*Math.sin(now/90):1;
      ctx.lineWidth=lw+.4;ctx.strokeStyle=col;ctx.fillStyle="rgba(0,0,0,.25)";
      ctx.beginPath();ctx.arc(x,y,(lw*4.2)*e*pulse,0,7);ctx.fill();ctx.stroke();
      if(m.num){
        const R=Math.max(9,lw*4),side=x>=px0?1:-1;
        let bx=x+side*(R*2.1),by=y-R*1.6;
        bx=Math.max(R+2,Math.min(cv.width/dpr-R-2,bx));by=Math.max(R+2,by);
        ctx.globalAlpha=e;ctx.fillStyle=col;ctx.beginPath();ctx.arc(bx,by,R,0,7);ctx.fill();
        ctx.fillStyle="#fff";ctx.font="700 "+Math.round(R*1.15)+"px Outfit, system-ui, sans-serif";
        ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(m.num),bx,by+.5);ctx.globalAlpha=1;
      }
    }
  }
}

/* ---------------- result screens ---------------- */
function merged(){
  const views=["side","front"].filter(v=>state.results[v]);
  const out={views,issues:[],borderline:[],good:[],nm:[],tips:[]};
  for(const v of views){const rep=state.results[v].rep;
    for(const x of rep.issues)out.issues.push(Object.assign({view:v},x));
    for(const x of rep.borderline)out.borderline.push(Object.assign({view:v},x));
    out.good.push(...rep.good);out.nm.push(...rep.not_measured);
    for(const t of rep.photo_tips)if(!out.tips.includes(t))out.tips.push(t);}
  out.issues.sort((a,b)=>(a.level==="notable"?0:1)-(b.level==="notable"?0:1));
  out.issues.forEach((x,i)=>x.num=i+1);
  return out;
}
function photoCards(views){
  return '<div class="photos'+(views.length>1?" two":"")+'">'+views.map(v=>
    '<div class="pcard"><span class="tag">'+VIEW_ZH[v]+'</span><div class="frame" data-view="'+v+'">'+
    '<img alt="'+VIEW_ZH[v]+'照片" src="'+state.results[v].ph.src+'"><canvas></canvas></div></div>').join("")+'</div>';
}
function drawResultPhotos(){
  const m=merged();
  document.querySelectorAll("#result .frame[data-view]").forEach(fr=>{
    const v=fr.dataset.view,entry=state.results[v],card=fr.parentElement;
    const two=m.views.length>1;
    fitFrame(fr,entry.ph.W,entry.ph.H,card.clientWidth-16,window.innerHeight*(two?0.42:0.52));
    const cv=fr.querySelector("canvas");sizeCanvas(cv,fr);
    const items=m.issues.filter(x=>x.view===v).concat(m.borderline.filter(x=>x.view===v));
    drawOverlay(cv,entry,{pts:1,edges:1,plumb:1,marks:1},marksFor(entry,items));
  });
}
function renderResult(){
  const m=merged(),n=m.issues.length,nb=m.borderline.length;
  const src=m.views.map(v=>VIEW_ZH[v]).join("和")+"照";
  let badge,h,p;
  if(n){badge=m.issues.some(x=>x.level==="notable")?"bad":"warn";
    h="发现 "+n+" 个体态问题";p="根据"+src+"分析 · 下面是具体情况和改善动作";}
  else if(nb){badge="ok";h="整体不错";p="有 "+nb+" 处在临界附近，可以留意";}
  else{badge="ok";h="体态不错";p="根据"+src+"分析，检查的几项都在正常范围内";}
  let html=photoCards(m.views);
  html+='<div class="summary rise"><div class="badge '+badge+'">'+(badge==="ok"?ICON.check:ICON.alert)+
        '</div><div><h2>'+esc(h)+'</h2><p>'+esc(p)+'</p></div></div>';
  m.issues.forEach((x,i)=>{
    html+='<article class="issue rise" style="animation-delay:'+(80+i*90)+'ms"><div class="issue-head">'+
      '<span class="num '+x.level+'">'+x.num+'</span><h3>'+esc(x.name)+'</h3><span class="lv '+x.level+'">'+esc(x.level_label)+'</span></div>'+
      '<p class="what">'+esc(x.summary)+'</p><p class="why">'+esc(x.why)+'</p>'+
      '<div class="tips"><h4>改善动作</h4>'+x.tips.map(t=>'<div class="tip"><i>'+ICON.move+'</i><b>'+esc(t.name)+'</b><span>'+esc(t.how)+'</span></div>').join("")+
      '</div></article>';
  });
  if(nb)html+='<div class="block rise"><h4>可以留意</h4>'+m.borderline.map(x=>
      '<div class="row"><div class="grow"><b>'+esc(x.name)+'</b><p>'+esc(x.summary)+'程度在正常与轻度之间。</p></div><span class="lv borderline">'+esc(x.level_label)+'</span></div>').join("")+'</div>';
  if(m.good.length)html+='<div class="block rise"><h4>这些方面不错</h4><div class="chips">'+
      m.good.map(g=>'<span class="chip">'+ICON.check+esc(g.name)+'</span>').join("")+'</div></div>';
  const notes=[];
  if(m.nm.length)notes.push("<b>这次没检查：</b>"+m.nm.map(x=>esc(x.name)+"（"+esc(x.reason)+"）").join("；"));
  if(m.tips.length)notes.push("<b>拍摄小建议：</b>"+m.tips.map(esc).join(" "));
  if(notes.length)html+=notes.map(t=>'<p class="note">'+t+'</p>').join("");
  const missing=["side","front"].find(v=>!state.results[v]);
  if(missing){const ov=C.copy.other_view[missing];
    html+='<button class="next rise" type="button" id="nextBtn">'+ICON.camera+'<div class="grow"><b>再拍一张'+esc(ov.label)+'照</b><span>还能检查'+esc(ov.covers)+'</span></div>'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';}
  html+='<button class="again" type="button" id="againBtn">重新检测</button>';
  $("#result").innerHTML=html;
  const nb2=$("#nextBtn");if(nb2)nb2.addEventListener("click",()=>fileInput.click());
  $("#againBtn").addEventListener("click",()=>{state.results={};state.last=null;show("home");});
}
function renderRetake(entry){
  const rep=entry.rep,has=Object.keys(state.results).length>0;
  let html="";
  if(entry.ph)html+='<div class="photos"><div class="pcard"><div class="frame" data-retake="1"><img alt="上传的照片" src="'+entry.ph.src+'"><canvas></canvas></div></div></div>';
  html+='<div class="summary rise"><div class="badge warn">'+ICON.alert+'</div><div><h2>这张照片没法准确分析</h2><p>换一张照片就好，按下面的提示拍</p></div></div>';
  html+='<div class="retake rise">'+rep.retake.map(x=>'<div class="row"><span class="rx">'+ICON.x+'</span><div class="grow"><b>'+esc(x.title)+'</b><p>'+esc(x.tip)+'</p></div></div>').join("")+'</div>';
  html+='<button class="next rise" type="button" id="retakeBtn">'+ICON.camera+'<div class="grow"><b>换一张照片</b><span>全身入镜 · 正面或侧面 · 自然站直</span></div>'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';
  if(has)html+='<button class="again" type="button" id="backBtn">返回上次结果</button>';
  $("#result").innerHTML=html;
  $("#retakeBtn").addEventListener("click",()=>fileInput.click());
  const b=$("#backBtn");if(b)b.addEventListener("click",()=>{renderResult();requestAnimationFrame(drawResultPhotos);window.scrollTo({top:0});});
  const fr=document.querySelector("#result .frame[data-retake]");
  if(fr){const img=fr.querySelector("img");
    const place=()=>{fitFrame(fr,entry.ph.W,entry.ph.H,fr.parentElement.clientWidth-16,window.innerHeight*0.42);
      if(entry.r){const cv=fr.querySelector("canvas");sizeCanvas(cv,fr);drawOverlay(cv,entry,{pts:1,edges:1,plumb:0,marks:0},[]);}};
    img.complete?place():img.addEventListener("load",place,{once:true});}
}
window.addEventListener("resize",()=>{
  if(!$("#result").hidden&&document.querySelector("#result .frame[data-view]"))drawResultPhotos();
});

/* ---------------- inputs ---------------- */
fileInput.addEventListener("change",()=>{
  const f=fileInput.files&&fileInput.files[0];fileInput.value="";
  if(f&&!state.busy)analyze({kind:"file",file:f});
});
$("#samples").innerHTML=SAMPLES.map((s,i)=>
  '<button class="sample" type="button" data-i="'+i+'"><img alt="'+esc(s.label)+'" src="data:image/jpeg;base64,'+s.thumb+'"><span>'+esc(s.label)+'</span></button>').join("");
$("#samples").addEventListener("click",e=>{const b=e.target.closest(".sample");
  if(b&&!state.busy)analyze({kind:"sample",sample:SAMPLES[+b.dataset.i]});});

/* ---------------- hero figure: a real detected skeleton, being scanned ---------------- */
const hero=(()=>{
  const cv=$("#heroCanvas"),s=SAMPLES[0],P=s.lm;let raf=0,on=false,col=null,frameN=0;
  const idx=JOINTS.filter(i=>P[i][1]<=s.h+20);
  function colors(){const cs=getComputedStyle(document.documentElement);
    return {ink:cs.getPropertyValue("--ink").trim()||"#0F221D",jade:cs.getPropertyValue("--jade").trim()||"#0F9E7B"};}
  function draw(now){
    const dpr=Math.min(2.5,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
    if(!w||!h)return;
    if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
    if(!col||frameN++%45===0)col=colors();
    const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    const xs=idx.map(i=>P[i][0]),ys=idx.map(i=>P[i][1]);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const k=Math.min((w-24)/(x1-x0||1),(h-26)/(y1-y0));
    const ox=(w-(x1-x0)*k)/2-x0*k,oy=h-8-(y1-y0)*k-y0*k;
    const X=i=>P[i][0]*k+ox,Y=i=>P[i][1]*k+oy;
    const t=REDUCED?0.62:((now||0)%3400)/3400,beamY=-10+(h+20)*t;
    const near=P[7][2]>=P[8][2]?23:24,px0=X(near);
    ctx.setLineDash([4,5]);ctx.strokeStyle=col.jade;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px0,Math.min(Y(0),Y(7))-14);ctx.lineTo(px0,h-4);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=col.ink;ctx.lineWidth=2.4;ctx.lineCap="round";ctx.globalAlpha=.85;
    for(const [a,b] of EDGES){ctx.beginPath();ctx.moveTo(X(a),Y(a));ctx.lineTo(X(b),Y(b));ctx.stroke();}
    ctx.globalAlpha=1;
    for(const i of idx){const near2=Math.max(0,1-Math.abs(Y(i)-beamY)/26);
      ctx.fillStyle=col.jade;ctx.beginPath();ctx.arc(X(i),Y(i),2.6+near2*2.4,0,7);ctx.fill();}
    const g=ctx.createLinearGradient(0,beamY-26,0,beamY);g.addColorStop(0,"rgba(15,158,123,0)");g.addColorStop(1,"rgba(15,158,123,.28)");
    ctx.fillStyle=g;ctx.fillRect(0,beamY-26,w,26);
    ctx.fillStyle=col.jade;ctx.fillRect(4,beamY,w-8,1.5);
    if(on&&!REDUCED)raf=requestAnimationFrame(draw);
  }
  return {run(v){on=v;cancelAnimationFrame(raf);if(v)raf=requestAnimationFrame(draw);}};
})();
hero.run(true);

</script>
