<title>体态读数台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f4f6f6; --surface:#ffffff; --raised:#fbfcfc;
  --ink:#182124; --muted:#5a6a70; --faint:#8b9a9f;
  --line:#dde3e4; --track:#e7ecec;
  --accent:#0e7c8a; --accent-soft:#e0f0f2;
  --ok:#2e7355; --warn:#8f6516; --alert:#9e3a2c;
  --ok-soft:#e3f0ea; --warn-soft:#f6eeda; --alert-soft:#f7e6e2;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#13181a; --surface:#1b2225; --raised:#212a2d;
  --ink:#e6edef; --muted:#8fa3aa; --faint:#6b7d83;
  --line:#2b3539; --track:#252e31;
  --accent:#35b5c4; --accent-soft:#12343a;
  --ok:#5fb98f; --warn:#d3a44a; --alert:#e0796a;
  --ok-soft:#16302a; --warn-soft:#33290f; --alert-soft:#341f1b;
}}
:root[data-theme="dark"]{
  --ground:#13181a; --surface:#1b2225; --raised:#212a2d;
  --ink:#e6edef; --muted:#8fa3aa; --faint:#6b7d83;
  --line:#2b3539; --track:#252e31;
  --accent:#35b5c4; --accent-soft:#12343a;
  --ok:#5fb98f; --warn:#d3a44a; --alert:#e0796a;
  --ok-soft:#16302a; --warn-soft:#33290f; --alert-soft:#341f1b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:0 16px;padding-block:28px 64px}
h1{font-size:23px;line-height:1.3;margin:0 0 6px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);font-size:14.5px;margin:0 0 4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--accent);font-weight:500;margin:0 0 10px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);
      border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink);margin:20px 0}
.note b{font-weight:600}
h2{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
   color:var(--faint);font-weight:500;margin:34px 0 12px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.samp{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0;
      cursor:pointer;overflow:hidden;text-align:left;font:inherit;color:inherit;display:block;
      transition:border-color .15s,box-shadow .15s}
.samp:hover{border-color:var(--accent)}
.samp[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.samp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.samp img{display:block;width:100%;height:108px;object-fit:cover;object-position:top center;background:var(--track)}
.samp span{display:block;padding:7px 9px 9px;font-size:11.5px;line-height:1.35;color:var(--muted)}
.samp b{display:block;color:var(--ink);font-weight:500;font-size:12px;margin-bottom:1px}
.panel{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;
       background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
@media (max-width:640px){.panel{grid-template-columns:1fr}}
.shot{position:relative}
.shot canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--track)}
.shotcap{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px;
      background:var(--raised);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent)}
.msg{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:9px;line-height:1.55}
.msg.block{background:var(--alert-soft);border:1px solid color-mix(in srgb,var(--alert) 30%,transparent)}
.msg.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent)}
.msg code{font-family:var(--mono);font-size:11px;opacity:.7}
.rows{display:flex;flex-direction:column;gap:2px}
.row{padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.diag{opacity:.72}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.rname{font-weight:500;font-size:14.5px}
.rname .sub{font-weight:400;font-size:11.5px;color:var(--faint);margin-left:5px}
.rval{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.rval .pm{font-size:11.5px;color:var(--muted);font-weight:400}
.gauge{width:100%;height:30px;display:block;overflow:visible}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px;font-size:13px}
.band{font-weight:600;font-size:13px}
.band.reference{color:var(--ok)} .band.slight{color:var(--warn)} .band.notable{color:var(--alert)}
.band.undet{color:var(--muted);font-weight:500;font-size:12.5px}
.prov{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.prov.measured{background:var(--ok-soft);color:var(--ok)}
.prov.guess{background:var(--alert-soft);color:var(--alert)}
.advice{margin:9px 0 0;padding-left:17px;font-size:13px;color:var(--muted);line-height:1.6}
.advice li{margin:3px 0}
.unavail{background:var(--raised);border:1px dashed var(--line);border-radius:8px;
         padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.55}
.unavail b{color:var(--ink);font-weight:500}
.foot{margin-top:38px;padding-top:20px;border-top:1px solid var(--line);
      font-size:12.5px;color:var(--muted);line-height:1.7}
.foot h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
         color:var(--faint);font-weight:500;margin:0 0 8px}
.foot ul{margin:0 0 14px;padding-left:17px}
.foot li{margin:4px 0}
.foot b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
